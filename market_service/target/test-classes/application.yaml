spring:
  application:
    name: market

  r2dbc:
    url: ${DB_URL:r2dbc:h2:mem:///market;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:password}

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
      key-prefix: ""
      use-key-prefix: true

  data:
    redis:
      repositories:
        enabled: false
      timeout: 5s
      lettuce:
        pool:
            max-active: 8
            max-idle: 8
            min-idle: 2
        shutdown-timeout: 100ms
  security:
    oauth2:
      client:
        registration:
          market-service:
            enabled: false

server:
  port: ${MARKET_PORT:8084}

payment-service:
  url: ${PAYMENT_URL:http://localhost:8085}

item:
  image:
    path: classpath:images/
  list-size: 3
