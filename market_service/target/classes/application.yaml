spring:
  application:
    name: market

  r2dbc:
    url: ${DB_URL:r2dbc:h2:mem:///market;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:password}

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  data:
    redis:
      host: ${CACHE_DB_HOST:localhost}
      port: ${CACHE_DB_PORT:6379}
      timeout: 2s
      lettuce:
          pool:
            enabled: false
  cache:
    type: redis
    redis:
       time-to-live: 600000
       cache-null-values: false
       key-prefix: ""
       use-key-prefix: true
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${MARKET_ISSUER_URI}
        registration:
          market-service:
            provider: keycloak
            authorizationGrantType: client_credentials
            client-id: market-service
            client-secret: ${CLIENT_SECRET}
            scope: profile
            clientAuthenticationMethod: client_secret_post

server:
  port: ${MARKET_PORT:8084}

payment-service:
  url: ${PAYMENT_URL:http://localhost:8085}

item:
  image:
    path: classpath:images/
  list-size: 3

